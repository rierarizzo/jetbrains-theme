name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Set via repository secret; the Open VSX step skips itself when absent.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A mismatched tag would publish the package.json version under a different tag.
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - run: npm run build

      - run: npx --yes @vscode/vsce@4 package --out jb-theme.vsix

      # Open VSX first: it accepts duplicates, so a re-run can retry the step that failed.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1 publish jb-theme.vsix --skip-duplicate

      # Last, because the Marketplace rejects an already published version.
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4 publish --packagePath jb-theme.vsix
