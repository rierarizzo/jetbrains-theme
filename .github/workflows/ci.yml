name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm run build

      - run: npx --yes @vscode/vsce@4 package --out jb-theme.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: jb-theme-vsix
          path: jb-theme.vsix
          if-no-files-found: error
